services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: abhi
      POSTGRES_PASSWORD: abhi_dev_password
      POSTGRES_DB: abhi_dance_studio
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
